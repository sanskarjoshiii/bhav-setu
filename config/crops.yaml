# Phase A2 — one block per crop. This file is the crop list for the whole system:
# scripts/init_db.py seeds `commodities` from it, ingestion/datagov.py asks
# data.gov.in for each crop's FIRST alias, and economics/spoilage.py reads k_c.
# Adding a crop is a change here and nowhere else.
#
# ── the three numbers that decide whether advice is sane ────────────────────
#
# shelf_life_days   Ambient, ungraded, farm-gate. The point at which roughly 40%
#                   of a lot is gone. NOT the supermarket "best before".
#
# k_c               The daily spoilage rate in
#                       spoilage_fraction(d) = 1 - exp(-k_c * d)
#                   (Phase A5 then adjusts it for storage type and temperature.)
#
#                   k_c is NOT hand-typed per crop. It is derived:
#
#                       k_c = spoilage_anchor / shelf_life_days
#
#                   with spoilage_anchor (0.54) from config/cost_model.yaml, which
#                   is exactly the onion pair this project already used
#                   (0.006 x 90). So "shelf life" has
#                   one meaning across all fourteen crops: 1 - exp(-0.54) = 42%
#                   of the lot gone. tests/test_phaseA2_crops.py re-derives every
#                   k_c and fails if one drifts. Change shelf_life_days, not k_c.
#
# max_hold_days     The longest hold the decision engine may ever propose. Set at
#                   roughly a fifth of shelf life, which lands every crop between
#                   10% and 19% spoilage at the limit — close to the 15% ceiling
#                   in config/decision.yaml, so the constraint genuinely bites on
#                   perishables instead of being decorative.
#
# perishability_class  Derived from shelf_life_days, not typed:
#                        1: <= 10 days   2: 11-20   3: 21-45   4: 46-100   5: > 100
#                      (Onion moved 3 -> 4 under this rule. It stores for three
#                      months; grouping it with cabbage was the old value's bug.)
#
# ── where the shelf lives come from ─────────────────────────────────────────
# National Horticulture Board ambient storage bands, as summarised in the FAO
# handling manual: 1-3 months for pomegranate and cabbage; under a month for
# banana, mango, grape and cauliflower; about a week for brinjal, okra and ripe
# tomato. ICAR-CIPHET's 2015 loss assessment is the cross-check on magnitude
# (4.6%-12.4% for vegetables through the whole chain; tomato worst at 12.4%).
#   SOURCE: https://www.fao.org/4/y4893e/y4893e06.htm
#   SOURCE: https://www.researchgate.net/publication/289637983
# These are national ambient figures, not Nashik-in-May figures. They are a
# defensible starting point, not a measurement — a horticulture reviewer should
# check them before anyone acts on a hold recommendation.
#
# ── aliases ─────────────────────────────────────────────────────────────────
# The FIRST alias must be data.gov.in's exact commodity spelling — that is the
# filter value ingestion/datagov.py sends. The rest feed the fuzzy matcher in
# ingestion/entity_resolution.py, so include the Marathi and the local trade name.

# ══════════════════════════════════════════════════════════════════════════
# storable — these are the crops where "hold" can be the right answer
# ══════════════════════════════════════════════════════════════════════════

