# Where a farmer is assumed to be standing when we compute distance to market.
# One per district: quoting a Solapur farmer his distance from a Nashik village
# would make every net-in-hand figure on the compare page wrong.
reference_villages:
  Nashik:     {name: Vinchur,   lat: 20.1100, lon: 74.3200}
  Pune:       {name: Narayangaon, lat: 19.0700, lon: 73.9600}
  Solapur:    {name: Mohol,     lat: 17.8200, lon: 75.6600}
  Ahmednagar: {name: Rahata,    lat: 19.7100, lon: 74.4800}

# The default when no district is known. Kept as a flat key because
# ingestion/routing.py and the Phase 2 tests already read it by this name.
reference_village:
  name: Vinchur
  lat: 20.1100
  lon: 74.3200
