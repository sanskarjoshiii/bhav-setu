# Phase A2 — four districts, seventeen market yards.
#
# Round 1 knew about the Nashik onion belt and nothing else. That was enough to
# forecast one crop; it is not enough to answer "which market should I go to?",
# because the whole point of the compare page is that a nearer market paying less
# can put more money in a farmer's hand — and you cannot show that with five
# markets inside one taluka.
#
# Districts were picked so the crop list has somewhere to live: Nashik for onion
# and grapes, Pune for the daily vegetable trade, Solapur for pomegranate and
# onion, Ahmednagar for onion and vegetables.
#
# The source spells sub-yards separately ("Lasalgaon(Vinchur)",
# "Pimpalgaon Baswant(Saykheda)", "Nasik"). entity_resolution.py folds those into
# these entries via its prefix rule plus fuzzy matching, so do not add them here.
#
# ⚠️ Coordinates are town centroids to about 3 decimal places, not surveyed APMC
#    gate positions. They feed road distance (ingestion/routing.py) and therefore
#    transport cost, so a 2-3 km error moves a 60 km trip's cost by a few percent.
#    Good enough to rank markets; worth replacing with real gate coordinates
#    before anyone quotes a rupee figure as exact.

mandis:
  # ── Nashik — onion capital, plus grapes and tomato ──────────────────────
  - name: Lasalgaon
    district: Nashik
    state: Maharashtra
    lat: 20.1436
    lon: 74.2372
