[pytest]
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
markers =
    phase0: environment and scaffold checks
    phase1: database schema and seed data checks
    phase2: ingestion, cleaning and audit checks
    phase3: feature builder and training matrix checks
    phaseA0: the forecast port — the seam the model plugs into
    phaseA1: data collection, serving grade
    phaseA2: multi-crop config, districts and coverage
    phaseA3: the baseline forecaster
