services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: bhav
      POSTGRES_PASSWORD: bhav
      POSTGRES_DB: bhav
    ports: ["5433:5432"]          # 5433 to avoid clashing with a local postgres
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhav"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata: {}
